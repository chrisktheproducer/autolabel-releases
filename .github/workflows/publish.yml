name: Publish release
# A build gets pushed to the "publish" branch; this turns it into a GitHub Release
# (which installed copies of AutoLabel check for updates) and then deletes the branch.
on:
  push:
    branches: [publish]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(grep '^version:' latest.yml | awk '{print $2}')
          NAME=$(grep '^productName:' meta.txt 2>/dev/null | awk '{print $2}'); NAME=${NAME:-BidTag}
          cp *-Setup-"$V".exe BidTag-Setup.exe   # fixed name for the website's download link
          gh release create "v$V" --target main --title "$NAME $V" --notes-file NOTES.md \
            *-Setup-"$V".exe *-Setup-"$V".exe.blockmap latest.yml BidTag-Setup.exe
      - name: Remove publish branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/publish"
